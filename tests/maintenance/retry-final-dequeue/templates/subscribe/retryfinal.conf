# Complete minimal subscribe config for the #148 flow reproduction.
# __QUEUE__ and __SUBTOPIC__ are substituted per case by the harness so
# each case owns an isolated broker queue and binding.
# The broker entry uses RabbitMQ's public default credentials for the
# disposable local container only; nothing here leaves the test machine.
broker amqp://guest:guest@127.0.0.1:__PORT__/
exchange xs_retryfinal
queueName __QUEUE__
topicPrefix v03.post
expire 1h
subtopic __SUBTOPIC__
batch __BATCH__
housekeeping 5
instances 1
directory __DOWNLOADS__
accept .*
flowCallback repro_cb.Observe
flowCallback repro_cb.KillAfterDequeue
