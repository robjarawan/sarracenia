name: Claude Code Review
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing a pull request for MetPX-Sarracenia, a Python data
            pump framework. Focus on: exception handling and resource cleanup
            (especially file/socket/FTP connections), edge cases in transport
            plugins, compatibility with SR3 config patterns, and Python style.
            Post a structured review with file:line references.
