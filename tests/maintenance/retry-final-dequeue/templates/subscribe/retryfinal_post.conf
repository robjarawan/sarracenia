# Post-path variant of retryfinal.conf for the #148 flow reproduction.
# Downloads succeed from real local files while publication fails against
# a closed local port, so failures persist to post_retry through the
# ordinary subscribe-then-post lifecycle. Placeholders, broker note and
# callback loading are exactly as in retryfinal.conf.
broker amqp://guest:guest@127.0.0.1:__PORT__/
exchange xs_retryfinal
queueName __QUEUE__
topicPrefix v03.post
expire 1h
subtopic __SUBTOPIC__
batch __BATCH__
housekeeping 5
instances 1
directory __DOWNLOADS__
accept .*
post_broker amqp://guest:guest@127.0.0.1:__DEADPORT__/
post_exchange xs_retryfinal_post
flowCallback repro_cb.Observe
flowCallback repro_cb.KillAfterDequeue
